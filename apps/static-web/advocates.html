<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocates - LegalTech Morocco</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="min-h-screen bg-gray-50">
        <!-- Navigation Bar -->
        <nav class="bg-white shadow-sm">
            <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="text-2xl font-bold text-blue-600">LegalTech Morocco</div>
                <div class="hidden md:flex gap-6 items-center">
                    <a href="analyze.html" class="text-gray-700 hover:text-blue-600">Contract Analysis</a>
                    <a href="advocates.html" class="text-blue-600 font-semibold">Advocates</a>
                    <a href="chat-history.html" class="text-gray-700 hover:text-blue-600">History</a>
                    <a href="profile.html" class="text-gray-700 hover:text-blue-600">Profile</a>
                </div>
                <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm">Logout</button>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-6xl mx-auto p-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Licensed Advocates</h1>
            <p class="text-gray-600 mb-8">Connect with experienced legal professionals for your contract review and consultation.</p>

            <!-- Loading State -->
            <div id="loadingState" class="flex justify-center items-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            </div>

            <!-- Advocates Grid -->
            <div id="advocatesGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Populated by JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12">
                <p class="text-gray-600 text-lg">No advocates available at this time.</p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="firestore.js"></script>
    <script>
        async function initPage() {
            const user = await getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            await loadAdvocates();
        }

        async function loadAdvocates() {
            try {
                const advocates = await getAdvocates();
                
                if (advocates.length === 0) {
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }

                const grid = document.getElementById('advocatesGrid');
                grid.innerHTML = '';

                advocates.forEach(advocate => {
                    const card = createAdvocateCard(advocate);
                    grid.appendChild(card);
                });

                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('advocatesGrid').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading advocates:', error);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            }
        }

        function createAdvocateCard(advocate) {
            const div = document.createElement('div');
            div.className = 'bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition duration-200';
            
            // Get initials for avatar
            const initials = advocate.name
                .split(' ')
                .map(part => part[0])
                .join('')
                .toUpperCase();

            const ratingStars = '★'.repeat(Math.floor(advocate.rating)) + 
                               (advocate.rating % 1 !== 0 ? '✦' : '');

            div.innerHTML = `
                <div class="p-6">
                    <!-- Avatar -->
                    <div class="flex justify-center mb-4">
                        <div class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center text-2xl font-bold">
                            ${initials}
                        </div>
                    </div>

                    <!-- Name -->
                    <h3 class="text-xl font-bold text-gray-800 text-center mb-2">${advocate.name}</h3>

                    <!-- Specialty -->
                    <p class="text-center text-blue-600 font-semibold mb-4">${advocate.specialty}</p>

                    <!-- Details -->
                    <div class="space-y-3 mb-6">
                        <!-- Rate -->
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-gray-600">Rate</span>
                            <span class="font-semibold text-gray-800">${advocate.rate} MAD/hr</span>
                        </div>

                        <!-- Experience -->
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-gray-600">Experience</span>
                            <span class="font-semibold text-gray-800">${advocate.experience} years</span>
                        </div>

                        <!-- Rating -->
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-gray-600">Rating</span>
                            <span class="text-yellow-500">${ratingStars} ${advocate.rating.toFixed(1)}</span>
                        </div>
                    </div>

                    <!-- Request Button -->
                    <button 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition duration-200"
                        onclick="requestReservation('${advocate.id}', '${advocate.name}')">
                        Request Reservation
                    </button>
                </div>
            `;

            return div;
        }

        function requestReservation(advocateId, advocateName) {
            // Store selected advocate in sessionStorage and redirect
            sessionStorage.setItem('selectedAdvocateId', advocateId);
            sessionStorage.setItem('selectedAdvocateName', advocateName);
            window.location.href = 'reservation.html';
        }

        async function handleLogout() {
            const result = await logout();
            if (result.success) {
                window.location.href = 'index.html';
            }
        }

        initPage();
    </script>
</body>
</html>
