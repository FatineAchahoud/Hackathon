<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LegalTech Morocco</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="min-h-screen bg-gradient-to-br from-blue-900 via-blue-800 to-blue-950 flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Logo/Header -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-white mb-2">LegalTech Morocco</h1>
                <p class="text-blue-200">AI-Powered Legal Contract Analysis</p>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-lg shadow-2xl p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Sign In</h2>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded"></div>

                <form id="loginForm" class="space-y-4">
                    <!-- Email Input -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            placeholder="you@example.com"
                        >
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            placeholder="••••••••"
                        >
                    </div>

                    <!-- Role Selection -->
                    <div class="mt-6">
                        <label class="block text-sm font-medium text-gray-700 mb-3">Login As</label>
                        <div class="flex gap-4">
                            <label class="flex items-center cursor-pointer">
                                <input 
                                    type="radio" 
                                    name="role" 
                                    value="client" 
                                    checked
                                    class="w-4 h-4 text-blue-600"
                                >
                                <span class="ml-2 text-gray-700">Client</span>
                            </label>
                            <label class="flex items-center cursor-pointer">
                                <input 
                                    type="radio" 
                                    name="role" 
                                    value="lawyer"
                                    class="w-4 h-4 text-blue-600"
                                >
                                <span class="ml-2 text-gray-700">Lawyer</span>
                            </label>
                        </div>
                    </div>

                    <div class="mt-4 p-3 rounded-lg bg-blue-50 border border-blue-100 text-xs text-blue-900">
                        <p><strong>Demo Client:</strong> client.demo@legaltech.ma / ClientDemo123</p>
                        <p><strong>Demo Lawyer:</strong> lawyer.demo@legaltech.ma / LawyerDemo123</p>
                    </div>

                    <!-- Submit Button -->
                    <button 
                        type="submit"
                        id="submitBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200 mt-6"
                    >
                        Sign In
                    </button>
                </form>

                <!-- Sign Up Link -->
                <p class="text-center text-gray-600 mt-4">
                    Don't have an account? 
                    <a href="register.html" class="text-blue-600 hover:text-blue-700 font-semibold">Create one</a>
                </p>
            </div>

            <!-- Legal Disclaimer -->
            <div class="mt-6 text-center text-blue-200 text-xs">
                <p>© 2026 LegalTech Morocco. AI analysis is not final legal advice.</p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        async function initLoginPage() {
            const user = await getCurrentUser();
            if (user) {
                window.location.href = 'dashboard.html';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            
            try {
                const result = await login(email, password, role);
                if (result.success) {
                    window.location.href = 'dashboard.html';
                } else {
                    showError(result.error || 'Login failed');
                }
            } catch (error) {
                showError(error.message);
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 5000);
        }

        initLoginPage();
    </script>
</body>
</html>
