<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat History - LegalTech Morocco</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="min-h-screen bg-gray-50">
        <!-- Navigation Bar -->
        <nav class="bg-white shadow-sm">
            <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="text-2xl font-bold text-blue-600">LegalTech Morocco</div>
                <div class="hidden md:flex gap-6 items-center">
                    <a href="analyze.html" class="text-gray-700 hover:text-blue-600">Contract Analysis</a>
                    <a href="advocates.html" class="text-gray-700 hover:text-blue-600">Advocates</a>
                    <a href="chat-history.html" class="text-blue-600 font-semibold">History</a>
                    <a href="profile.html" class="text-gray-700 hover:text-blue-600">Profile</a>
                </div>
                <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm">Logout</button>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-6xl mx-auto p-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">My History</h1>
            <p class="text-gray-600 mb-8">View your past contract analyses and reservation requests.</p>

            <!-- Tabs -->
            <div class="flex gap-4 mb-8 border-b border-gray-300">
                <button 
                    id="analysesTab" 
                    class="px-6 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 cursor-pointer"
                >
                    Contract Analyses
                </button>
                <button 
                    id="reservationsTab" 
                    class="px-6 py-3 font-semibold text-gray-600 hover:text-blue-600 cursor-pointer"
                >
                    <span id="reservationsTabLabel">Reservations</span>
                </button>
            </div>

            <!-- Analyses Section -->
            <div id="analysesSection">
                <div id="analysesLoading" class="flex justify-center items-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                </div>

                <div id="analysesEmpty" class="hidden text-center py-12">
                    <p class="text-gray-600 text-lg">No contract analyses yet.</p>
                    <a href="analyze.html" class="text-blue-600 hover:text-blue-700 font-semibold mt-2 inline-block">
                        → Start your first analysis
                    </a>
                </div>

                <div id="analysesList" class="hidden space-y-4">
                    <!-- Populated by JavaScript -->
                </div>
            </div>

            <!-- Reservations Section -->
            <div id="reservationsSection" class="hidden">
                <div id="reservationsLoading" class="flex justify-center items-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                </div>

                <div id="reservationsEmpty" class="hidden text-center py-12">
                    <p id="reservationsEmptyText" class="text-gray-600 text-lg">No reservation requests yet.</p>
                    <a href="advocates.html" class="text-blue-600 hover:text-blue-700 font-semibold mt-2 inline-block">
                        → Browse advocates
                    </a>
                </div>

                <div id="reservationsList" class="hidden space-y-4">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="firestore.js"></script>
    <script>
        let currentUserId = null;
        let currentUserRole = 'client';

        async function initPage() {
            const user = await getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            currentUserId = user.uid;
            currentUserRole = user.role;

            if (currentUserRole === 'lawyer') {
                document.getElementById('reservationsTabLabel').textContent = 'Incoming Cases';
                document.getElementById('reservationsEmptyText').textContent = 'No incoming client reservations yet.';
            }

            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            
            // Tab switching
            document.getElementById('analysesTab').addEventListener('click', () => showTab('analyses'));
            document.getElementById('reservationsTab').addEventListener('click', () => showTab('reservations'));

            // Load analyses by default
            await loadAnalyses(user.uid);
        }

        function showTab(tab) {
            const analysesSection = document.getElementById('analysesSection');
            const reservationsSection = document.getElementById('reservationsSection');
            const analysesTab = document.getElementById('analysesTab');
            const reservationsTab = document.getElementById('reservationsTab');

            if (tab === 'analyses') {
                analysesSection.classList.remove('hidden');
                reservationsSection.classList.add('hidden');
                analysesTab.className = 'px-6 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 cursor-pointer';
                reservationsTab.className = 'px-6 py-3 font-semibold text-gray-600 hover:text-blue-600 cursor-pointer';
                loadAnalyses(currentUserId);
            } else {
                analysesSection.classList.add('hidden');
                reservationsSection.classList.remove('hidden');
                analysesTab.className = 'px-6 py-3 font-semibold text-gray-600 hover:text-blue-600 cursor-pointer';
                reservationsTab.className = 'px-6 py-3 font-semibold text-blue-600 border-b-2 border-blue-600 cursor-pointer';
                loadReservations(currentUserId);
            }
        }

        async function loadAnalyses(userId) {
            try {
                document.getElementById('analysesLoading').classList.remove('hidden');
                document.getElementById('analysesEmpty').classList.add('hidden');
                document.getElementById('analysesList').classList.add('hidden');

                const analyses = await getContractAnalyses(userId);

                if (analyses.length === 0) {
                    document.getElementById('analysesLoading').classList.add('hidden');
                    document.getElementById('analysesEmpty').classList.remove('hidden');
                    return;
                }

                const list = document.getElementById('analysesList');
                list.innerHTML = '';

                analyses.forEach(analysis => {
                    const card = createAnalysisCard(analysis);
                    list.appendChild(card);
                });

                document.getElementById('analysesLoading').classList.add('hidden');
                document.getElementById('analysesList').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading analyses:', error);
                document.getElementById('analysesLoading').classList.add('hidden');
                document.getElementById('analysesEmpty').classList.remove('hidden');
            }
        }

        async function loadReservations(userId) {
            try {
                document.getElementById('reservationsLoading').classList.remove('hidden');
                document.getElementById('reservationsEmpty').classList.add('hidden');
                document.getElementById('reservationsList').classList.add('hidden');

                const reservations = await getReservations(userId);

                if (reservations.length === 0) {
                    document.getElementById('reservationsLoading').classList.add('hidden');
                    document.getElementById('reservationsEmpty').classList.remove('hidden');
                    return;
                }

                const list = document.getElementById('reservationsList');
                list.innerHTML = '';

                for (const reservation of reservations) {
                    try {
                        const advocate = await getAdvocateById(reservation.advocateId);
                        const card = createReservationCard(reservation, advocate);
                        list.appendChild(card);
                    } catch (error) {
                        console.error('Error loading advocate:', error);
                    }
                }

                document.getElementById('reservationsLoading').classList.add('hidden');
                document.getElementById('reservationsList').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading reservations:', error);
                document.getElementById('reservationsLoading').classList.add('hidden');
                document.getElementById('reservationsEmpty').classList.remove('hidden');
            }
        }

        function createAnalysisCard(analysis) {
            const div = document.createElement('div');
            div.className = 'bg-white rounded-lg shadow p-6 hover:shadow-lg transition duration-200';

            const date = new Date(analysis.createdAt).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            const risks = analysis.risks || [];
            const highCount = risks.filter(r => r.severity === 'High').length;
            const mediumCount = risks.filter(r => r.severity === 'Medium').length;
            const lowCount = risks.filter(r => r.severity === 'Low').length;

            div.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="font-semibold text-gray-800">Contract Analysis</h3>
                        <p class="text-sm text-gray-600">${date}</p>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4 mb-4">
                    <div class="text-center p-3 bg-red-50 rounded">
                        <div class="text-2xl font-bold text-red-600">${highCount}</div>
                        <p class="text-xs text-gray-600">High Risk</p>
                    </div>
                    <div class="text-center p-3 bg-yellow-50 rounded">
                        <div class="text-2xl font-bold text-yellow-600">${mediumCount}</div>
                        <p class="text-xs text-gray-600">Medium Risk</p>
                    </div>
                    <div class="text-center p-3 bg-green-50 rounded">
                        <div class="text-2xl font-bold text-green-600">${lowCount}</div>
                        <p class="text-xs text-gray-600">Low Risk</p>
                    </div>
                </div>

                <div class="mb-4 p-3 bg-gray-50 rounded text-sm text-gray-700">
                    <p>${analysis.summary || 'Contract analysis completed'}</p>
                </div>

                <button 
                    onclick="viewAnalysisDetails('${analysis.id}')"
                    class="text-blue-600 hover:text-blue-700 font-semibold text-sm">
                    View Details →
                </button>
            `;

            return div;
        }

        function createReservationCard(reservation, advocate) {
            const div = document.createElement('div');
            div.className = 'bg-white rounded-lg shadow p-6 hover:shadow-lg transition duration-200';

            const date = new Date(reservation.createdAt).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            const statusColor = {
                'pending': 'bg-yellow-100 text-yellow-800',
                'accepted': 'bg-green-100 text-green-800',
                'rejected': 'bg-red-100 text-red-800'
            }[reservation.status] || 'bg-gray-100 text-gray-800';

            const advocateInfo = advocate 
                ? `<p class="text-sm text-blue-600 font-semibold">${advocate.name}</p>`
                : '<p class="text-sm text-gray-500">Advocate info not available</p>';

            div.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="font-semibold text-gray-800">Reservation Request</h3>
                        <p class="text-sm text-gray-600">${date}</p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusColor}">
                        ${reservation.status.charAt(0).toUpperCase() + reservation.status.slice(1)}
                    </span>
                </div>

                <div class="mb-4">
                    <p class="text-xs text-gray-500 uppercase mb-1">Advocate</p>
                    ${advocateInfo}
                </div>

                <div class="mb-4 p-3 bg-gray-50 rounded text-sm text-gray-700">
                    <p>"${reservation.message.substring(0, 100)}${reservation.message.length > 100 ? '...' : ''}"</p>
                </div>

                <div class="flex gap-3">
                    <button 
                        onclick="viewReservationDetails('${reservation.id}')"
                        class="text-blue-600 hover:text-blue-700 font-semibold text-sm">
                        View Details →
                    </button>
                </div>
            `;

            return div;
        }

        function viewAnalysisDetails(analysisId) {
            alert('View full analysis details: ' + analysisId);
            // In a real app, this would redirect to a details page
        }

        function viewReservationDetails(reservationId) {
            alert('View full reservation details: ' + reservationId);
            // In a real app, this would redirect to a details page
        }

        async function handleLogout() {
            const result = await logout();
            if (result.success) {
                window.location.href = 'index.html';
            }
        }

        initPage();
    </script>
</body>
</html>
